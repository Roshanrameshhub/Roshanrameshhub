            72.4%, 73.4% { opacity: 1; transform: translateY(0); }
            85.7%, 100% { opacity: 0; transform: translateY(-6px); }
        }
        @keyframes role6 {
            0%, 85.7% { opacity: 0; transform: translateY(6px); }
            86.7%, 87.7% { opacity: 1; transform: translateY(0); }
            100.0%, 100% { opacity: 0; transform: translateY(-6px); }
        }
    @keyframes scanline { 0% { transform: translateY(0); } 100% { transform: translateY(300px); } }
  </style>

