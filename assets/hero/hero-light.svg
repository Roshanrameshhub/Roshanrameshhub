<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="heroBg_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="aurora_light" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18">
        <animate attributeName="stop-color" values="#2563EB;#7C3AED;#0891B2" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.10">
        <animate attributeName="stop-color" values="#0891B2;#7C3AED;#2563EB" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.14">
        <animate attributeName="stop-color" values="#2563EB;#0891B2;#7C3AED" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="titleGrad_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow_light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    
        @keyframes role0 {
            0%, 0.0% { opacity: 0; transform: translateY(6px); }
            1.0%, 2.0% { opacity: 1; transform: translateY(0); }
            14.3%, 100% { opacity: 0; transform: translateY(-6px); }
        }
        @keyframes role1 {
            0%, 14.3% { opacity: 0; transform: translateY(6px); }
            15.3%, 16.3% { opacity: 1; transform: translateY(0); }
            28.6%, 100% { opacity: 0; transform: translateY(-6px); }
        }
        @keyframes role2 {
            0%, 28.6% { opacity: 0; transform: translateY(6px); }
            29.6%, 30.6% { opacity: 1; transform: translateY(0); }
            42.9%, 100% { opacity: 0; transform: translateY(-6px); }
        }
        @keyframes role3 {
            0%, 42.9% { opacity: 0; transform: translateY(6px); }
            43.9%, 44.9% { opacity: 1; transform: translateY(0); }
            57.1%, 100% { opacity: 0; transform: translateY(-6px); }
