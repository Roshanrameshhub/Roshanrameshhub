<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="400" height="130">
  <rect width="400" height="130" rx="8" fill="#0A0E1A" stroke="rgba(0, 229, 255, 0.18)" stroke-width="0.5"/>
  <text x="200" y="20" text-anchor="middle" fill="#94A3B8" font-family="'Courier New',monospace" font-size="7.5" letter-spacing="3">LEETCODE CONSISTENCY</text>

  <g transform="translate(30, 45)">
    <text x="0" y="10" fill="#94A3B8" font-family="'Courier New',monospace" font-size="8">CURRENT ACTIVITY</text>
    <rect x="130" y="2" width="210" height="10" rx="5" fill="#475569" opacity="0.2"/>
    <rect x="130" y="2" width="180" height="10" rx="5" fill="#00E5FF">
      <animate attributeName="width" from="0" to="180" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="350" y="10" fill="#00E5FF" font-family="'Courier New',monospace" font-size="8" font-weight="700">ACTIVE</text>
  </g>

  <g transform="translate(30, 80)">
    <text x="0" y="10" fill="#94A3B8" font-family="'Courier New',monospace" font-size="8">50-DAY BADGE</text>
    <rect x="130" y="2" width="210" height="10" rx="5" fill="#475569" opacity="0.2"/>
    <rect x="130" y="2" width="210" height="10" rx="5" fill="#10B981">
      <animate attributeName="width" from="0" to="210" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="350" y="10" fill="#10B981" font-family="'Courier New',monospace" font-size="8" font-weight="700">100%</text>
  </g>
</svg>